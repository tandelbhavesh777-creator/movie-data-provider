name: Hourly Refresh

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:      # manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.lookatmy }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run fetch script
        env:
          GITHUB_TOKEN: ${{ secrets.lookatmy }}
        run: python scripts/fetch_movies.py

      - name: Commit & push
        run: |
          git config user.name "gh-actions"
          git config user.email "gh-actions@github.com"
          git add movies.json
          git diff --staged > patch
          if [ -s patch ]; then \
            git commit -am "Auto-update $(date +%Y-%m-%d)" && git push; \
          else \
            echo "No changes to commit"
          fi
